name: Prepare demo Android release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: New demo release tag (publish after two-device acceptance)
        required: true
        default: demo-sprint3
      build_number:
        description: Increasing Android version code
        required: true
        default: '30084'
      version_name:
        description: Demo version name
        required: true
        default: 1.0.0-demo.3
permissions:
  contents: write
concurrency:
  group: prepare-demo-android-release
  cancel-in-progress: false
env:
  API_URL: https://crabshare-api.azurewebsites.net
  WEB_URL: https://crabshare.vercel.app
jobs:
  apk:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CRABSHARE_KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/demo-release.jks
      CRABSHARE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      CRABSHARE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      CRABSHARE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Validate release inputs and private signing configuration
        env:
          DEMO_TAG: ${{ inputs.tag }}
          DEMO_BUILD: ${{ inputs.build_number }}
          DEMO_VERSION: ${{ inputs.version_name }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, re
          if not re.fullmatch(r'demo-[A-Za-z0-9._-]+', os.environ['DEMO_TAG']): raise SystemExit('Invalid demo tag')
          if not os.environ['DEMO_BUILD'].isdigit() or not 1 <= int(os.environ['DEMO_BUILD']) <= 2100000000: raise SystemExit('Invalid build number')
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?', os.environ['DEMO_VERSION']): raise SystemExit('Invalid version')
          for name in ['KEYSTORE_BASE64','CRABSHARE_STORE_PASSWORD','CRABSHARE_KEY_PASSWORD','CRABSHARE_KEY_ALIAS']:
              if not os.environ.get(name): raise SystemExit('Missing private Android signing configuration: '+name)
          path=pathlib.Path(os.environ['CRABSHARE_KEYSTORE_PATH'])
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True)); path.chmod(0o600)
          PY
      - name: Analyze, test and build HTTPS APK
        working-directory: mobile
        env:
          DEMO_BUILD: ${{ inputs.build_number }}
          DEMO_VERSION: ${{ inputs.version_name }}
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release --build-name="$DEMO_VERSION" --build-number="$DEMO_BUILD" --dart-define=API_URL="$API_URL" --dart-define=WEB_URL="$WEB_URL"
      - name: Verify signature and package public release evidence
        run: python3 mobile/scripts/package_demo.py --apk mobile/build/app/outputs/flutter-apk/app-release.apk --output demo-release --revision "$GITHUB_SHA" --api "$API_URL" --web "$WEB_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-apk-${{ github.sha }}
          path: demo-release/
          if-no-files-found: error
      - name: Create draft prerelease for device acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          DEMO_TAG: ${{ inputs.tag }}
        run: gh release create "$DEMO_TAG" demo-release/* --draft --prerelease --target "$GITHUB_SHA" --title 'CrabShare Sprint 3 Android demo' --notes-file docs/demo-release-notes.md
      - name: Remove private signing file
        if: always()
        run: rm -f "$CRABSHARE_KEYSTORE_PATH"
