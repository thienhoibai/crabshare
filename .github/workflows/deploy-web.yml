name: Deploy web

# Vercel gói Hobby chỉ deploy commit do chủ tài khoản Vercel tạo; commit/merge của thành viên khác bị
# "Deployment was blocked". Workflow này deploy bằng Vercel CLI với token của chủ project (secret
# VERCEL_TOKEN) nên ai commit hay merge cũng deploy được. Git integration của Vercel đã tắt trong
# web/vercel.json (git.deploymentEnabled=false) để không deploy hai lần và không còn check đỏ.
#
#   push main     → production  https://crabshare.vercel.app
#   push develop  → preview, gắn alias cố định DEVELOP_ALIAS (khớp mẫu CORS crabshare-*-nguyn1hien.vercel.app)
#   pull request  → preview, link được ghi vào comment của PR
#
# Thiết lập một lần (chủ project Vercel): Settings → Secrets and variables → Actions:
#   VERCEL_TOKEN       token tạo ở vercel.com/account/tokens
#   VERCEL_ORG_ID      "Your ID" ở Account Settings (tài khoản cá nhân) hoặc Team ID
#   VERCEL_PROJECT_ID  Project Settings → General → Project ID
# Cách làm tay và biến môi trường (VITE_API_URL): docs/deploy.md
on:
  push:
    branches: [main, develop]
    paths:
      - web/**
      - .github/workflows/deploy-web.yml
  pull_request:
    branches: [main, develop]
    paths:
      - web/**
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  PRODUCTION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  DEVELOP_ALIAS: crabshare-develop-nguyn1hien.vercel.app

jobs:
  deploy:
    name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Thiếu secret:$missing — xem phần đầu .github/workflows/deploy-web.yml"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Lấy cấu hình project (Root Directory = web) và biến môi trường của đúng môi trường.
      # Chạy ở gốc repo: CLI tự chuyển vào Root Directory khi build.
      - name: Pull project settings and environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=$([ "$PRODUCTION" = "true" ] && echo production || echo preview) --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build $([ "$PRODUCTION" = "true" ] && echo --prod) --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt $([ "$PRODUCTION" = "true" ] && echo --prod) --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Alias develop preview to a fixed URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # --scope bắt buộc: token tạo theo team ("Hobby team") không gọi được API người dùng, thiếu nó CLI báo "User not found".
        run: vercel alias set "${{ steps.deploy.outputs.url }}" "$DEVELOP_ALIAS" --scope "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN" || echo "::warning::Không gắn được alias $DEVELOP_ALIAS (tên đã có người dùng?). Bản preview vẫn ở ${{ steps.deploy.outputs.url }}"

      - name: Comment preview link on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- deploy-web-preview -->'
          body="$marker
          Preview web: $URL (commit ${GITHUB_SHA::7})"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi
