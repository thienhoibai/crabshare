name: Acceptance tooling
on:
  pull_request:
    paths:
      - tools/acceptance/**
      - .github/workflows/acceptance-tools.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    name: Acceptance script safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test isolated-account cleanup, redaction and URL boundaries
        run: python3 -m unittest discover -s tools/acceptance -p test_server_acceptance.py
      - name: Check browser script syntax without contacting production
        run: node --check tools/acceptance/admin_smoke.cjs
