name: crabshare_mobile
description: "CrabShare mobile app — nhà đầu tư theo dõi lô, hộ nuôi ghi nhật ký, chụp bằng chứng, thu hoạch."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Thư viện Material (từ Flutter 3.44 tách khỏi SDK): import 'package:material_ui/material_ui.dart',
  # KHÔNG dùng 'package:flutter/material.dart' — trộn hai cái sẽ lỗi kiểu ThemeData/TextTheme.
  material_ui: ^1.6.0

  # Trạng thái + DI (provider), điều hướng, HTTP — xem mobile/README.md mục "Vì sao chọn".
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1

  # Lưu token đăng nhập an toàn (Keychain / Keystore).
  flutter_secure_storage: ^11.2.0

  # Định dạng tiền VND, ngày giờ.
  intl: ^0.20.3

  # Chụp ảnh bằng chứng / ảnh xác nhận gắn tem.
  image_picker: ^1.2.4

  # Chuẩn bị quét tem và lấy vị trí ảnh bằng chứng cho các task tiếp theo.
  mobile_scanner: ^7.4.2
  geolocator: ^14.1.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
